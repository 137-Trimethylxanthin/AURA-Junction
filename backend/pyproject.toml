[project]
name = "aura-backend"
version = "0.1.0"
description = "AURA: Automated Understanding of Rooms & Areas, backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ezdxf>=1.4.5",
    "fastapi>=0.162.7",
    "fastmcp>=4.2.0",
    "google-genai>=3.3.0",
    "httpx>=0.28.1",
    "ifcopenshell>=0.9.0.post1",
    "jstore",
    "modal>=1.6.4",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pypdfium2>=5.15.2",
    "python-multipart>=0.0.33",
    "shapely>=2.2.0",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
# Kept so existing commands (`uv run --extra ifc ...`) still work; ifcopenshell is now required (jstore).
ifc = [
    "ifcopenshell>=0.9.0.post1",
]

[tool.uv.sources]
# Felix's lossless store as an in-process library (one backend, one process); see store/pyproject.toml.
jstore = { path = "../store", editable = true }

[tool.uv]
# rapidocr-onnxruntime asks for opencv-python (needs libGL); jstore ships opencv-python-headless instead.
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "dataset: needs the local data/ directory (Swiss Dwellings / CubiCasa5k)",
  "live: makes live Gemini calls (set AURA_LIVE=1)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
